appId: app.priceright
productName: PriceRight
copyright: Copyright 2026 PriceRight

directories:
  output: dist-electron

files:
  - electron/main.js
  - electron/preload.js
  - electron/icons/**
  - client-dist/**
  - package.json

extraResources:
  - from: server/demo.db
    to: server/demo.db
  - from: server-dist
    to: server-dist
  - from: client-dist/templates
    to: client-dist/templates
  - from: server/node_modules
    to: node_modules
    filter:
      - "**"
      - "!.cache"

win:
  target:
    - target: nsis
      arch: x64
    # appx target disabled for v1.0.48 release — Store icon assets not yet ready
    # - target: appx
    #   arch: x64
  icon: electron/icons/icon.ico
  artifactName: "PriceRight-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PriceRight

appx:
  identityName: PriceRight.PriceRight
  applicationId: PriceRight.PriceRight
  publisher: CN=20D20DC5-BE01-4B08-BA59-F46570DF7AAA
  publisherDisplayName: PriceRight

beforePack: scripts/electron-before-pack.js
afterPack: scripts/electron-after-pack.js

publish:
  provider: github
  owner: KwakuAsamoah
  repo: priceright
